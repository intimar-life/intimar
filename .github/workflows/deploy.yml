name: Deploy to GitHub Pages (intimar.life)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment at a time; let an in-flight one finish rather
# than cancel it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true
          cache: npm

      - run: npm ci

      # Production build (site https://intimar.life, base /): the repo's
      # GitHub Pages custom domain is intimar.life, so Pages serves this at
      # the domain root. Setting DEPLOY_TARGET=gh-pages here instead would
      # build for the intimar-life.github.io/intimar subpath (noindexed staging),
      # which breaks every asset path once a custom domain is set.
      - name: Build (intimar.life production config)
        run: npm run build
        env:
          PUBLIC_PRIMEVUE_LICENSE_KEY: ${{ secrets.PUBLIC_PRIMEVUE_LICENSE_KEY }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
