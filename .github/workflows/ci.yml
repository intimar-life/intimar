name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUBLIC_PRIMEVUE_LICENSE_KEY: ${{ secrets.PUBLIC_PRIMEVUE_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Unused files, exports and dependencies (knip.dev).
      - name: Unused code
        run: npm run knip

      - name: Spell check
        run: npm run spellcheck

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lighthouse (performance + payload size budgets)
        run: npm run lighthouse

      - name: Upload Lighthouse report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium

      - name: Unit tests
        run: npm run test:unit

      - name: Storybook component tests
        run: npm run test:storybook

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
